name: uemp-services

services:
  postgres:
    image: postgres:16-alpine
    container_name: uemp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uemp}
      POSTGRES_USER: ${POSTGRES_USER:-uemp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uemp_dev_password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - uemp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  uemp_postgres_data:
